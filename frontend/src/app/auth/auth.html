<div class="min-h-screen-safe w-full flex items-center justify-center p-6 animate-fade-in">
  <div class="w-full max-w-lg">
    <!-- Branding -->
    <div class="flex items-center justify-center gap-4 mb-12">
      <div class="w-16 h-16 bento-card flex items-center justify-center text-3xl animate-float">
        🍅
      </div>
      <div>
        <h1 class="text-3xl font-display font-bold text-white tracking-tighter">Pomidorowa</h1>
        <p class="text-[10px] font-black uppercase tracking-[0.3em] text-slate-500">Zarządzanie Czasem</p>
      </div>
    </div>

    <!-- Auth Bento Card -->
    <div class="bento-card p-10 md:p-14">
      <!-- Tab Switcher -->
      <div class="flex p-1.5 bg-slate-950 rounded-[1.5rem] mb-12 border border-slate-800">
        <button 
          (click)="setTab('login')"
          class="flex-1 py-3 rounded-2xl text-xs font-black uppercase tracking-widest transition-all duration-300"
          [class.bg-white]="activeTab() === 'login'"
          [class.text-slate-950]="activeTab() === 'login'"
          [class.text-slate-500]="activeTab() !== 'login'">
          LOGOWANIE
        </button>
        <button 
          (click)="setTab('register')"
          class="flex-1 py-3 rounded-2xl text-xs font-black uppercase tracking-widest transition-all duration-300"
          [class.bg-white]="activeTab() === 'register'"
          [class.text-slate-950]="activeTab() === 'register'"
          [class.text-slate-500]="activeTab() !== 'register'">
          REJESTRACJA
        </button>
      </div>

      <form (ngSubmit)="submit()" class="space-y-6">
        <div class="space-y-2">
          <label class="text-[10px] font-black uppercase tracking-widest text-slate-500 ml-1">E-mail</label>
          <input 
            type="email" 
            [(ngModel)]="email" 
            name="email"
            placeholder="użytkownik@pomidorowa.pl"
            class="input-bento w-full"
            required>
        </div>

        <div class="space-y-2">
          <label class="text-[10px] font-black uppercase tracking-widest text-slate-500 ml-1">Hasło</label>
          <input 
            type="password" 
            [(ngModel)]="password" 
            name="password"
            placeholder="••••••••••••"
            class="input-bento w-full"
            required>
        </div>

        @if (error()) {
          <div class="bg-rose-500/10 border border-rose-500/20 text-rose-400 text-[10px] font-black uppercase tracking-widest py-4 px-6 rounded-2xl animate-fade-in text-center">
            Błąd: {{ error() }}
          </div>
        }

        <button 
          type="submit" 
          [disabled]="loading()"
          class="btn-bento-primary w-full mt-6 group/btn">
          @if (loading()) {
            <span class="flex items-center justify-center gap-3">
              <svg class="animate-spin h-4 w-4 text-slate-950" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              LOGOWANIE...
            </span>
          } @else {
            <span class="flex items-center justify-center gap-2">
              {{ activeTab() === 'login' ? 'ROZPOCZNIJ SESJĘ' : 'UTWÓRZ KONTO' }}
              <span class="inline-block transition-transform group-hover/btn:translate-x-1">→</span>
            </span>
          }
        </button>
      </form>
    </div>

    <!-- Footer Meta -->
    <div class="mt-12 text-center">
    </div>
  </div>
</div>
